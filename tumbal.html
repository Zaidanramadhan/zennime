<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e50914">
<title>ZENNIME</title>

<link rel="manifest" href="manifest.json">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background: radial-gradient(circle at top,#1a1a2e,#0b0b0f);
    color:white;
}

/* LOADER */
#loader{
    position:fixed;
    inset:0;
    background:#0b0b0f;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.loader-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.loader-content img{
    width:80px;
}

.loader-content p{
    color:#e50914;
    font-weight:bold;
    letter-spacing:2px;
}

.spinner{
    width:45px;
    height:45px;
    border:4px solid #333;
    border-top:4px solid #e50914;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg);}}

/* NAV */
nav{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    z-index:10;
}

nav h1{color:#e50914;}

nav input{
    padding:8px;
    border:none;
    border-radius:6px;
}

nav button{
    background:#e50914;
    border:none;
    color:white;
    padding:8px 10px;
    border-radius:6px;
    cursor:pointer;
}

/* SUGGEST */
.suggest{
    position:absolute;
    top:55px;
    right:25px;
    background:#1a1a1a;
    width:200px;
    border-radius:8px;
    overflow:hidden;
    display:none;
}

.suggest div{
    padding:10px;
    cursor:pointer;
}

.suggest div:hover{
    background:#e50914;
}

/* HERO */
.hero{
    height:350px;
    background:url("https://images.unsplash.com/photo-1524985069026-dd778a71c7b4?w=1400") center/cover;
    display:flex;
    align-items:flex-end;
    padding:20px;
}

/* PAGE */
.page{display:none;padding-top:80px;}
.active{display:block;}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:15px;
    padding:20px;
}

/* CARD */
.card{
    position:relative;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    transition:0.25s;
    background:#1a1a1a;
}

.card:hover{
    transform:scale(1.08);
    filter:brightness(1.2);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card p{
    padding:8px;
    font-size:13px;
}

.heart{
    position:absolute;
    top:8px;
    right:8px;
    cursor:pointer;
    color:white;
}

.fav{color:#e50914;}

/* EPISODE */
#episodePage{
    padding:90px 20px;
}

iframe{
    width:100%;
    height:400px;
    border-radius:12px;
}

/* EP BTN */
.ep-btn{
    margin:5px;
    padding:8px;
    background:#222;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

.ep-btn:hover{
    background:#e50914;
}

/* MOBILE */
@media(max-width:768px){
iframe{height:220px;}
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
    <div class="loader-content">
        <img src="https://i.imgur.com/4M7IWwP.png">
        <div class="spinner"></div>
        <p>ZENNIME</p>
    </div>
</div>

<!-- NAV -->
<nav>
    <h1>ZENNIME</h1>
    <input id="search" placeholder="Cari anime...">
    <button onclick="openFav()">❤️</button>

    <div id="suggestBox" class="suggest"></div>
</nav>

<!-- HOME -->
<div id="homePage" class="page active">
<div class="hero"><h2>Streaming Anime</h2></div>
<div class="grid" id="animeGrid"></div>
</div>

<!-- FAVORITE -->
<div id="favPage" class="page">
<button class="ep-btn" onclick="backHome()">⬅ Kembali</button>
<h2 style="padding:20px;">Favorit ❤️</h2>
<div class="grid" id="favGrid"></div>
</div>

<!-- EPISODE -->
<div id="episodePage" class="page">
<button class="ep-btn" onclick="backHome()">⬅ Kembali</button>
<h2 id="title"></h2>
<iframe id="player"></iframe>
<div id="episodeList"></div>
</div>

<script>

    if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => console.log("SW Registered"))
    .catch(err => console.log("SW Error", err));
}

/* LOADER */
window.onload=()=>{
setTimeout(()=>{
document.getElementById("loader").style.display="none";
},1000);
};

/* DATA */
let animeData=[];
let fav=JSON.parse(localStorage.getItem("fav"))||[];

const grid=document.getElementById("animeGrid");
const suggestBox=document.getElementById("suggestBox");

/* API */
async function loadAnime(){
let res=await fetch("https://api.jikan.moe/v4/top/anime");
let json=await res.json();

animeData=json.data.map(a=>({
id:a.mal_id,
title:a.title,
image:a.images.jpg.image_url,
episodes:["dQw4w9WgXcQ","ysz5S6PUM-U","kXYiU_JCYtU"]
}));

render(animeData);
}

loadAnime();

/* RENDER */
function render(list){
grid.innerHTML="";
list.forEach((a,i)=>{
let isFav=fav.includes(a.id);

grid.innerHTML+=`
<div class="card" onclick="openAnime(${i})">
<div class="heart ${isFav?'fav':''}" onclick="toggleFav(event,${a.id})">❤</div>
<img src="${a.image}">
<p>${a.title}</p>
</div>`;
});
}

/* FAVORITE */
function toggleFav(e,id){
e.stopPropagation();

if(fav.includes(id)){
fav=fav.filter(x=>x!==id);
}else{
fav.push(id);
}

localStorage.setItem("fav",JSON.stringify(fav));
render(animeData);
renderFav();
}

/* SEARCH + SUGGEST */
search.addEventListener("input",function(){
let val=this.value.toLowerCase();

let filtered=animeData.filter(a=>
a.title.toLowerCase().includes(val)
);

render(filtered);

if(val===""){
suggestBox.style.display="none";
return;
}

suggestBox.innerHTML="";
filtered.slice(0,5).forEach(a=>{
suggestBox.innerHTML+=`
<div onclick="selectAnime('${a.title}')">${a.title}</div>`;
});

suggestBox.style.display="block";
});

function selectAnime(title){
search.value=title;
suggestBox.style.display="none";
render(animeData.filter(a=>a.title===title));
}

/* OPEN */
function openAnime(i){
let a=animeData[i];

homePage.classList.remove("active");
favPage.classList.remove("active");
episodePage.classList.add("active");

title.innerText=a.title;

episodeList.innerHTML="";

a.episodes.forEach((ep,idx)=>{
episodeList.innerHTML+=`
<button class="ep-btn" onclick="play('${ep}')">Ep ${idx+1}</button>`;
});

play(a.episodes[0]);
}

function play(id){
player.src="https://www.youtube.com/embed/"+id;
}

/* FAVORITE PAGE */
function openFav(){
homePage.classList.remove("active");
episodePage.classList.remove("active");
favPage.classList.add("active");
renderFav();
}

function renderFav(){
let data=animeData.filter(a=>fav.includes(a.id));
let favGrid=document.getElementById("favGrid");

favGrid.innerHTML="";

data.forEach(a=>{
favGrid.innerHTML+=`
<div class="card">
<img src="${a.image}">
<p>${a.title}</p>
</div>`;
});
}

/* BACK */
function backHome(){
homePage.classList.add("active");
favPage.classList.remove("active");
episodePage.classList.remove("active");
player.src="";
}

</script>

</body>
</html>
